<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍅 פומודורו - טיימר למידה</title>
  <style>
    :root {
      --tomato: #e23b2e;
      --tomato-dark: #b71c1c;
      --leaf: #5aa02c;
      --leaf-dark: #3d7a1a;
      --bg1: #fff3f0;
      --bg2: #ffe0d6;
      --text: #3a2b28;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Heebo", Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      padding: 24px;
      gap: 8px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    /* ---- העגבניה ---- */
    .tomato-wrap {
      position: relative;
      width: 260px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 18px 24px rgba(178, 28, 28, 0.28));
    }

    .tomato-wrap.running { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .tomato-wrap.done { animation: celebrate 0.6s ease-in-out 4; }
    @keyframes celebrate {
      0%, 100% { transform: rotate(0) scale(1); }
      25% { transform: rotate(-6deg) scale(1.06); }
      75% { transform: rotate(6deg) scale(1.06); }
    }

    .tomato-svg { width: 100%; height: 100%; overflow: visible; }

    /* הטיימר בתוך העגבניה */
    .timer-display {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.35);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    /* ---- כרטיס הבקרה ---- */
    .panel {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 10px 30px rgba(178,28,28,0.12);
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }

    .minutes-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .minutes-row label { font-weight: 600; }

    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 14px;
      padding: 6px;
      box-shadow: inset 0 0 0 2px var(--bg2);
    }

    .stepper button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      background: var(--bg2);
      color: var(--tomato-dark);
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .stepper button:hover { background: #ffcdbf; }
    .stepper button:active { transform: scale(0.92); }

    .stepper input {
      width: 52px;
      border: none;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      background: transparent;
      outline: none;
    }
    /* הסתרת חצי המספר */
    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .stepper input[type=number] { -moz-appearance: textfield; }

    .presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .presets button {
      border: none;
      background: #fff;
      color: var(--tomato-dark);
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 0 0 2px var(--bg2);
      transition: all 0.15s;
    }
    .presets button:hover { background: var(--bg2); }
    .presets button.active { background: var(--tomato); color: #fff; box-shadow: none; }

    .controls { display: flex; gap: 10px; }
    .controls button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    .controls button:active { transform: scale(0.96); }

    .btn-primary { background: var(--tomato); color: #fff; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-secondary { background: #fff; color: var(--tomato-dark); box-shadow: inset 0 0 0 2px var(--bg2); }
    .btn-secondary:hover { background: var(--bg2); }

    .status {
      text-align: center;
      font-size: 0.95rem;
      min-height: 22px;
      font-weight: 600;
      opacity: 0.85;
    }

    /* ---- בורר הצלילים ---- */
    .sound-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 2px dashed var(--bg2);
      padding-top: 16px;
    }

    .sound-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .sound-row label { font-weight: 600; }

    #soundSelect {
      flex: 1;
      min-width: 140px;
      border: none;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      background: #fff;
      box-shadow: inset 0 0 0 2px var(--bg2);
      cursor: pointer;
      outline: none;
    }

    .btn-preview {
      border: none;
      border-radius: 12px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--leaf);
      color: #fff;
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-preview:hover { filter: brightness(1.08); }
    .btn-preview:active { transform: scale(0.94); }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-row label {
      font-weight: 600;
      width: 42px;
    }
    .slider-row input[type=range] {
      flex: 1;
      accent-color: var(--tomato);
      cursor: pointer;
    }
    .slider-val {
      width: 52px;
      text-align: left;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      opacity: 0.75;
    }

    .footer-stats {
      font-size: 0.85rem;
      opacity: 0.6;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🍅 פומודורו ללמידה</h1>
  <div class="subtitle">בחרו כמה זמן להתרכז, ותנו לעגבניה לעבוד בשבילכם</div>

  <div class="tomato-wrap" id="tomatoWrap">
    <svg class="tomato-svg" viewBox="0 0 200 200" aria-hidden="true">
      <!-- גוף העגבניה -->
      <defs>
        <radialGradient id="tomGrad" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#ff6b5a" />
          <stop offset="55%" stop-color="#e23b2e" />
          <stop offset="100%" stop-color="#b71c1c" />
        </radialGradient>
      </defs>
      <ellipse cx="100" cy="118" rx="82" ry="74" fill="url(#tomGrad)" />
      <!-- ברק/הבהקה -->
      <ellipse cx="68" cy="88" rx="22" ry="14" fill="rgba(255,255,255,0.28)" transform="rotate(-25 68 88)" />
      <!-- עלים -->
      <g fill="var(--leaf)" stroke="var(--leaf-dark)" stroke-width="1.5">
        <path d="M100 50 q-14 -22 -34 -20 q14 8 16 22 q-18 -8 -30 2 q18 2 24 14 q-10 0 -16 8 q22 -4 40 -6 z"/>
        <path d="M100 50 q14 -22 34 -20 q-14 8 -16 22 q18 -8 30 2 q-18 2 -24 14 q10 0 16 8 q-22 -4 -40 -6 z"/>
      </g>
      <!-- גבעול -->
      <rect x="95" y="34" width="10" height="22" rx="5" fill="var(--leaf-dark)" />
    </svg>
    <div class="timer-display" id="display">25:00</div>
  </div>

  <div class="panel">
    <div class="minutes-row">
      <div class="field">
        <label for="minInput">דקות:</label>
        <div class="stepper">
          <button id="minus" aria-label="פחות">−</button>
          <input id="minInput" type="number" min="0" max="180" value="25" />
          <button id="plus" aria-label="עוד">+</button>
        </div>
      </div>
      <div class="field">
        <label for="secInput">שניות:</label>
        <div class="stepper">
          <button id="secMinus" aria-label="פחות">−</button>
          <input id="secInput" type="number" min="0" max="59" value="0" />
          <button id="secPlus" aria-label="עוד">+</button>
        </div>
      </div>
    </div>

    <div class="presets" id="presets">
      <button data-min="5">5</button>
      <button data-min="15">15</button>
      <button data-min="25" class="active">25</button>
      <button data-min="45">45</button>
      <button data-min="60">60</button>
    </div>

    <div class="controls">
      <button class="btn-primary" id="startBtn">▶ התחל</button>
      <button class="btn-secondary" id="resetBtn">↺ אפס</button>
    </div>

    <div class="status" id="status">מוכנים כשתהיו 😊</div>

    <div class="sound-section">
      <div class="sound-row">
        <label for="soundSelect">צליל סיום:</label>
        <select id="soundSelect"></select>
        <button class="btn-preview" id="previewBtn">▶ נגן</button>
      </div>
      <div class="slider-row">
        <label for="volRange">חוזק</label>
        <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.3" />
        <span class="slider-val" id="volVal">30%</span>
      </div>
      <div class="slider-row">
        <label for="durRange">אורך</label>
        <input type="range" id="durRange" min="0.3" max="4" step="0.1" value="1.5" />
        <span class="slider-val" id="durVal">1.5 ש'</span>
      </div>
    </div>
  </div>

  <div class="footer-stats" id="stats"></div>

  <script>
    const display   = document.getElementById('display');
    const minInput  = document.getElementById('minInput');
    const minus     = document.getElementById('minus');
    const plus      = document.getElementById('plus');
    const secInput  = document.getElementById('secInput');
    const secMinus  = document.getElementById('secMinus');
    const secPlus   = document.getElementById('secPlus');
    const startBtn  = document.getElementById('startBtn');
    const resetBtn  = document.getElementById('resetBtn');
    const statusEl  = document.getElementById('status');
    const presetsEl = document.getElementById('presets');
    const tomatoWrap= document.getElementById('tomatoWrap');
    const statsEl   = document.getElementById('stats');
    const soundSelect = document.getElementById('soundSelect');
    const previewBtn  = document.getElementById('previewBtn');
    const volRange    = document.getElementById('volRange');
    const durRange    = document.getElementById('durRange');
    const volVal      = document.getElementById('volVal');
    const durVal      = document.getElementById('durVal');

    let totalSeconds = 25 * 60;
    let remaining    = totalSeconds;
    let timerId      = null;
    let running      = false;
    let endTime      = 0; // חישוב מבוסס שעון אמת כדי שיהיה מדויק גם ברקע

    // --- מצב למידה היומי (נשמר בדפדפן) ---
    let sessionsToday = +(localStorage.getItem('pomo_sessions') || 0);
    let minutesToday  = +(localStorage.getItem('pomo_minutes')  || 0);
    renderStats();

    function clampMinutes(v) {
      v = Math.round(v || 0);
      if (v < 0) v = 0;
      if (v > 180) v = 180;
      return v;
    }

    function readInputs() {
      // קורא דקות+שניות מהשדות, מנרמל לטווח חוקי, ומחזיר סך שניות (לפחות 1)
      let m = clampMinutes(+minInput.value);
      let s = Math.round(+secInput.value || 0);
      if (s < 0) s = 0;
      if (s > 59) s = 59;
      let total = m * 60 + s;
      if (total < 1) total = 1;
      return total;
    }

    function syncInputs() {
      // מציג את totalSeconds בשדות הדקות/שניות וב-presets
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      minInput.value = m;
      secInput.value = s;
      [...presetsEl.children].forEach(b =>
        b.classList.toggle('active', +b.dataset.min * 60 === totalSeconds));
    }

    function format(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function render() {
      display.textContent = format(remaining);
      document.title = (running ? '▶ ' : '') + format(remaining) + ' 🍅 פומודורו';
    }

    function setTotal(sec) {
      totalSeconds = Math.min(180 * 60, Math.max(1, Math.round(sec)));
      if (!running) { remaining = totalSeconds; render(); }
      syncInputs();
    }

    function tick() {
      remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
      render();
      if (remaining <= 0) finish();
    }

    function start() {
      if (running) { pause(); return; }
      if (remaining <= 0) remaining = totalSeconds;
      running = true;
      endTime = Date.now() + remaining * 1000;
      timerId = setInterval(tick, 250);
      startBtn.textContent = '⏸ השהה';
      statusEl.textContent = 'בהצלחה! ראשים בריכוז 🎯';
      tomatoWrap.classList.add('running');
      tomatoWrap.classList.remove('done');
      // נדרש מחווה של המשתמש כדי להעיר את האודיו
      ensureAudio();
    }

    function pause() {
      running = false;
      clearInterval(timerId);
      startBtn.textContent = '▶ המשך';
      statusEl.textContent = 'מושהה ⏸';
      tomatoWrap.classList.remove('running');
      render();
    }

    function reset() {
      running = false;
      clearInterval(timerId);
      remaining = totalSeconds;
      startBtn.textContent = '▶ התחל';
      statusEl.textContent = 'מוכנים כשתהיו 😊';
      tomatoWrap.classList.remove('running', 'done');
      render();
    }

    function finish() {
      running = false;
      clearInterval(timerId);
      remaining = 0;
      render();
      startBtn.textContent = '▶ התחל';
      statusEl.textContent = '🎉 כל הכבוד! סיימתם סבב למידה';
      tomatoWrap.classList.remove('running');
      tomatoWrap.classList.add('done');

      // עדכון סטטיסטיקה
      sessionsToday += 1;
      minutesToday  += Math.round(totalSeconds / 60);
      localStorage.setItem('pomo_sessions', sessionsToday);
      localStorage.setItem('pomo_minutes', minutesToday);
      renderStats();

      playSelected();

      // התראת דפדפן אם אושר
      if (window.Notification && Notification.permission === 'granted') {
        new Notification('🍅 הזמן נגמר!', { body: 'כל הכבוד, סיימתם סבב למידה 🎉' });
      }
    }

    function renderStats() {
      statsEl.textContent = `היום: ${sessionsToday} סבבים · ${minutesToday} דקות למידה`;
    }

    // ---- צליל כיפי עם Web Audio (בלי קבצים חיצוניים) ----
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    // צליל בודד (יחידת בניין לכל הצלילים)
    function tone(t0, freq, dur, vol, type = 'sine', glideTo = null) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + Math.min(0.03, dur * 0.2));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }

    // עשרה צלילים. כל אחד מקבל (t0, vol, dur) ומתפרס על פני dur שניות.
    const SOUNDS = [
      { id: 'bell', name: '🔔 פעמון קלאסי', play(t0, v, d) {
          const n = [523.25, 659.25, 783.99, 1046.5];
          const s = d / (n.length + 0.6);
          n.forEach((f, i) => tone(t0 + i * s, f, Math.max(0.4, s * 2.2), v, 'triangle'));
          tone(t0 + n.length * s, 1318.5, Math.max(0.6, d * 0.5), v, 'sine');
      }},
      { id: 'beep', name: '📟 ביפ', play(t0, v, d) {
          const s = d / 3;
          for (let i = 0; i < 3; i++) tone(t0 + i * s, 880, s * 0.55, v, 'square');
      }},
      { id: 'ding', name: '🛎️ דינג', play(t0, v, d) {
          tone(t0, 880, d, v, 'sine');
          tone(t0, 1760, d * 0.6, v * 0.4, 'sine');
      }},
      { id: 'marimba', name: '🪵 מרימבה', play(t0, v, d) {
          const sc = [523, 587, 659, 784, 880];
          const s = d / sc.length;
          sc.forEach((f, i) => tone(t0 + i * s, f, s * 1.6, v, 'triangle'));
      }},
      { id: 'chip', name: '🎮 8-ביט', play(t0, v, d) {
          const arp = [523, 659, 784, 1046];
          const steps = 8, s = d / steps;
          for (let i = 0; i < steps; i++) tone(t0 + i * s, arp[i % arp.length] * (i < 4 ? 1 : 2), s * 0.85, v, 'square');
      }},
      { id: 'gong', name: '🥁 גונג', play(t0, v, d) {
          tone(t0, 110, d, v, 'sine');
          tone(t0, 110 * 1.5, d * 0.8, v * 0.6, 'triangle');
          tone(t0, 110 * 2.01, d * 0.6, v * 0.4, 'sine');
      }},
      { id: 'whistle', name: '🎵 שריקה עולה', play(t0, v, d) {
          tone(t0, 400, d, v, 'sine', 1900);
      }},
      { id: 'doorbell', name: '🚪 דינג-דונג', play(t0, v, d) {
          tone(t0, 659.25, d * 0.5, v, 'sine');
          tone(t0 + d * 0.45, 523.25, d * 0.55, v, 'sine');
      }},
      { id: 'sparkle', name: '✨ נצנוצים', play(t0, v, d) {
          const n = 7, s = d / n;
          for (let i = 0; i < n; i++) {
            const f = 1046.5 * Math.pow(1.18, (i % 2 ? i : -i / 2));
            tone(t0 + i * s, f, s * 1.4, v * (1 - i / (n * 2)), 'sine');
          }
      }},
      { id: 'fanfare', name: '🎉 חצוצרת ניצחון', play(t0, v, d) {
          const chord = [523.25, 659.25, 783.99];
          chord.forEach(f => tone(t0, f, d * 0.6, v * 0.7, 'sawtooth'));
          tone(t0 + d * 0.45, 1046.5, d * 0.55, v, 'sawtooth');
      }},
    ];

    function currentSound() {
      return SOUNDS.find(s => s.id === soundSelect.value) || SOUNDS[0];
    }

    function playSelected() {
      ensureAudio();
      if (!audioCtx) return;
      const vol = parseFloat(volRange.value);
      const dur = parseFloat(durRange.value);
      currentSound().play(audioCtx.currentTime + 0.02, vol, dur);
    }

    // ---- אירועים ----
    startBtn.addEventListener('click', start);
    resetBtn.addEventListener('click', reset);

    // כפתורי דקות
    minus.addEventListener('click', () => setTotal(readInputs() - 60));
    plus .addEventListener('click', () => setTotal(readInputs() + 60));
    // כפתורי שניות — עם גלילה (59+1 → דקה, 0−1 → 59 בדקה הקודמת)
    secMinus.addEventListener('click', () => setTotal(readInputs() - 1));
    secPlus .addEventListener('click', () => setTotal(readInputs() + 1));

    // הקלדה ידנית בשני השדות
    minInput.addEventListener('change', () => setTotal(readInputs()));
    secInput.addEventListener('change', () => setTotal(readInputs()));
    [minInput, secInput].forEach(inp => inp.addEventListener('input', () => {
      if (!running) { totalSeconds = readInputs(); remaining = totalSeconds; render(); }
    }));

    presetsEl.addEventListener('click', e => {
      if (e.target.dataset.min) { setTotal(+e.target.dataset.min * 60); }
    });

    // מקש רווח = התחל/השהה
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        start();
      }
    });

    // ---- בורר הצלילים ----
    // מילוי הרשימה
    SOUNDS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      soundSelect.appendChild(opt);
    });

    // טעינת העדפות שמורות
    soundSelect.value = localStorage.getItem('pomo_sound') || 'bell';
    if (!currentSound()) soundSelect.value = 'bell';
    volRange.value = localStorage.getItem('pomo_vol') || '0.3';
    durRange.value = localStorage.getItem('pomo_dur') || '1.5';

    function updateLabels() {
      volVal.textContent = Math.round(parseFloat(volRange.value) * 100) + '%';
      durVal.textContent = parseFloat(durRange.value).toFixed(1) + ' ש\'';
    }
    updateLabels();

    soundSelect.addEventListener('change', () => {
      localStorage.setItem('pomo_sound', soundSelect.value);
      playSelected(); // תצוגה מקדימה מיידית בבחירה
    });
    volRange.addEventListener('input', () => { updateLabels(); localStorage.setItem('pomo_vol', volRange.value); });
    durRange.addEventListener('input', () => { updateLabels(); localStorage.setItem('pomo_dur', durRange.value); });
    previewBtn.addEventListener('click', playSelected);

    // בקשת רשות להתראות (לא חובה)
    if (window.Notification && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }

    setTotal(25 * 60);
    render();
  </script>
</body>
</html>
